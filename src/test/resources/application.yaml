spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  jwt:
    secret-key: dummy_secret_key_for_testing_purposes_only
    expiration: 3600000

  brevo:
    smtp-api-key: dummy_brevo_api_key

  flyway:
    enabled: false
